services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: skyblip
      POSTGRES_PASSWORD: skyblip
      POSTGRES_DB: skyblip_dev
    ports:
      - "5432:5432"
    volumes:
      - skyblip_pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyblip"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  skyblip_pgdata:
